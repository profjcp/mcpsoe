apiVersion: apps/v1
kind: Deployment
metadata:
  name: ask-bot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ask-bot
  template:
    metadata:
      labels:
        app: ask-bot
    spec:
      containers:
      - name: ask-bot
        image: tu-registro/ask-bot:latest
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: MCP_SERVER_URL
          value: "http://mcp-server:9000"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ask-bot-service
spec:
  selector:
    app: ask-bot
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000